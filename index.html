<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forex Options AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="landing-page">
    <section class="info-panel">
      <div class="logo">A</div>
      <h1>Forex Options AI</h1>
      <p class="tagline">Trade smarter with AI-driven insights</p>
      <ul class="features">
        <li>📊 Real-Time Forex Rates</li>
        <li>🤖 AI Strategy Suggestions</li>
        <li>📅 Macro Event Tracking</li>
      </ul>
      <button id="launchDemoBtn">Launch Interactive Demo</button>
    </section>

    <section class="mockup-panel">
      <div id="demoApp" class="mockup">
        <div class="screen">
          <div class="rate">EUR/USD <span>1.0843</span></div>
          <div class="rate red">USD/JPY <span>142.89</span></div>
          <div class="rate green">GBP/USD <span>1.2711</span></div>
          <h3>AI Insight</h3>
          <div class="insight">📈 Long GBP/USD</div>
          <div class="insight red">📉 Hedge EUR/USD Volatility</div>
        </div>
        <nav class="bottom-nav">
          <button onclick="showAlert('Rates')">📊</button>
          <button onclick="showAlert('AI')">🤖</button>
          <button onclick="showAlert('Settings')">⚙️</button>
        </nav>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
